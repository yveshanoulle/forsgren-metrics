# forsgren configuration: what this installation measures.
# Reference: https://github.com/yveshanoulle/forsgren#configuration
version: 1
view: standard
auto_update: true
auto_update_level: major
history_days: 1825
history_page: false  # not generated 
issues_page: unlisted   # generated at issues.html, not in the menu, while it is in beta (forsgren#200)
projects:
  - name: Forsgren
    repositories:
      - name: yveshanoulle/forsgren
        deployments:
          release: Releases
          environment=github-pages: {label: forsgren.be, paths: [README.md, cmd/readmepage/, internal/readmepage/, internal/page/styles.css, Scripts/build_starter_page.sh]}
