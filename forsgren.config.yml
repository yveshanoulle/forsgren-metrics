# forsgren configuration: what this installation measures.
# Reference: https://github.com/yveshanoulle/forsgren#configuration
version: 1
view: standard
auto_update: true
auto_update_level: major
dora_days: 180
history_days: 1825
working_hours: 24
history_page: false # not generated 
issues_page: unlisted 
days_page: unlisted
# generated at issues.html, not in the menu, while it is in beta (forsgren#200)
tbd_time_to_main: false
tbd_pr_lead_time: false
projects:
  - name: Forsgren
    repositories:
      - name: yveshanoulle/forsgren
        deployments:
          release: {label: Releases, paths: [cmd/, internal/, go.mod, go.sum, agent-installer.md, agent-upgrade.md, agent-delete.md]}
          environment=github-pages: {label: Website, paths: [README.md, cmd/readmepage/, internal/readmepage/, internal/page/styles.css, Scripts/build_starter_page.sh]}
