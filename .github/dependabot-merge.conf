# The Dependabot merge policy's settings, read by forsgren's reusable
# workflow (.github/workflows/dependabot_merge.yml calls it) from the default
# branch, never from a pull request. The syntax is forsgren's
# docs/dependabot-merge.md. Anything not allowed here stays a manual merge.
#
# allow <ecosystem> <dependency-type or *> <update-type> [<dependency-name>]
# deny <ecosystem> <dependency-name, or a name prefix followed by *>
# workflow <file> <name>
#
# Allowed: GitHub Actions pins, patch and minor, the only ecosystem this
# repository has (.github/dependabot.yml). Every major update is a manual
# merge.
allow github_actions * semver-patch
allow github_actions * semver-minor

# The forsgren pins of forsgren.yml and forsgren-update.yml are
# forsgren-update.yml's: auto_update and auto_update_level in
# forsgren.config.yml decide them (forsgren's docs/dependabot-merge.md, In a
# forsgren installation). They are denied by name, not as the whole
# repository, so the pin of the merge policy itself, in its own pull request
# (.github/dependabot.yml keeps it out of the forsgren group), still merges
# as the allow lines say.
deny github_actions yveshanoulle/forsgren/.github/workflows/metrics.yml
deny github_actions yveshanoulle/forsgren/.github/workflows/auto_update.yml

# Expected: the one workflow that checks every pull request into main.
# forsgren-update.yml also runs on pull requests, but it is no check: it
# merges forsgren's own release pull request and is green when it leaves one.
workflow .github/workflows/checks.yml Checks
